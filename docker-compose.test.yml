services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beluno_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      BELUNO_MIGRATOR_DB_PASSWORD: migrator_password
      BELUNO_API_DB_PASSWORD: api_password
      BELUNO_WORKER_DB_PASSWORD: worker_password
      BELUNO_SCHEDULER_DB_PASSWORD: scheduler_password
    volumes:
      - ./sql/init-local-roles.sh:/docker-entrypoint-initdb.d/10-init-local-roles.sh:ro
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrator -d beluno_test"]
      interval: 2s
      timeout: 2s
      retries: 20
